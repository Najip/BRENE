name: Build BRENE KernelSU module

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'module/**'
      - '.github/workflows/build-brene.yml'

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version=//p' module/module.prop | head -n 1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "Version not found in module/module.prop"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=BRENE-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build direct flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f "dist/${{ steps.version.outputs.zip_name }}"
          (
            cd module
            zip -qr "../dist/${{ steps.version.outputs.zip_name }}" .
          )
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRENE-module-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
