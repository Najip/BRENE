name: Build BRENE KernelSU module

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'module/**'
      - '.github/workflows/build-brene.yml'

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read module version
        id: version
        shell: bash
        run: |
          set -e
          VERSION=$(grep -E '^version=' module/module.prop | cut -d= -f2 | tr -d '\r')
          if [ -z "$VERSION" ]; do
            echo "Unable to find module version in module/module.prop"
            exit 1
          fi
          ZIP_NAME="BRENE-${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build flashable KernelSU ZIP
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cd module
          zip -r "../dist/${{ steps.version.outputs.zip_name }}" . \
            -x "*.DS_Store" \
            -x "*/.DS_Store" \
            -x "*.git*" \
            -x "*/.git*"
          cd ..
          ls -lh dist

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRENE-module-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
